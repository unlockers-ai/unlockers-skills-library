name: skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Bundled references match docs/
        run: python3 tools/sync-references.py --check
      - name: Skills load in Claude Code, OpenCode and Copilot
        run: python3 tools/validate-skills.py
